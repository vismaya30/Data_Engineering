services:
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PG_DATABASE:-payments}
      POSTGRES_USER: ${PG_USER:-payments}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-payments}
    ports:
      - "${PG_PORT:-15432}:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-payments} -d ${PG_DATABASE:-payments}"]
      interval: 5s
      retries: 10

  airflow:
    build: .
    command: standalone
    env_file: .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
      PROJECT_DIR: /opt/airflow/project
      PG_HOST: warehouse
      PG_PORT: "5432"
    ports:
      - "8080:8080"
    volumes:
      - .:/opt/airflow/project
      - ${HOME}/.aws:/home/airflow/.aws:ro
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  warehouse-data:
